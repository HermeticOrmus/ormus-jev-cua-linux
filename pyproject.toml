[project]
name = "ormus-jev-cua-linux"
version = "0.1.0"
description = "Linux AT-SPI action layer for Ormus Jev computer-use (arc-cua contract parity)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]
# System packages (prefer apt, not pip):
#   python3-gi gir1.2-atspi-2.0 python3-pyatspi at-spi2-core xdotool
linux = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ormus_jev_cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
